services:
  postgres:
    image: postgres:18.1
    environment:
      POSTGRES_DB: dynamite
      POSTGRES_USER: dynamite_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python server/dev.py up first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dynamite_dev -d dynamite"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres-data:
