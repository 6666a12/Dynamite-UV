<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1024" viewBox="0 0 1280 1024" role="img" aria-labelledby="title desc">
  <title id="title">DUX Community miss fallthrough animation V1</title>
  <desc id="desc">A distance-driven twenty-frame miss preview: the note passes the judgment line, stays opaque for 24 pixels, then fades out by 64 pixels.</desc>
  <defs>
    <linearGradient id="tap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8f4ff"/>
      <stop offset="0.18" stop-color="#86d8ff"/>
      <stop offset="0.56" stop-color="#4db8ff"/>
      <stop offset="1" stop-color="#166cae"/>
    </linearGradient>
    <linearGradient id="judge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35e0ff" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#35e0ff" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#baf8ff" stop-opacity="0.88"/>
      <stop offset="0.88" stop-color="#35e0ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#35e0ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="note-glow" x="-40%" y="-200%" width="180%" height="500%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feFlood flood-color="#4db8ff" flood-opacity="0.58"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="line-glow" x="-20%" y="-600%" width="140%" height="1300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#35e0ff" flood-opacity="0.5"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cell"><rect width="256" height="256"/></clipPath>
  </defs>
