<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hit Effect Prototype V2</title>
<style>
:root{color-scheme:dark;--bg:#080b12;--panel:#111722;--line:#263247;--text:#e9f1ff;--muted:#8794a8;--accent:#65d8ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,sans-serif}body{display:grid;place-items:center;padding:24px}.shell{width:min(1120px,100%)}.top{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:14px}h1{margin:0;font-size:20px;letter-spacing:.04em}.hint{color:var(--muted);font-size:12px}.stage-wrap{border:1px solid var(--line);background:#0b1019;box-shadow:0 18px 60px #0008}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;cursor:crosshair}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px;border:1px solid var(--line);border-top:0;background:var(--panel)}button{border:1px solid #33445f;background:#172132;color:var(--text);padding:7px 11px;border-radius:5px;cursor:pointer;font:inherit}button:hover,button.active{border-color:var(--accent);color:#fff;background:#1a3448}label{color:var(--muted);display:inline-flex;align-items:center;gap:6px;margin-left:6px}input[type=range]{accent-color:var(--accent);width:130px}.readout{margin-left:auto;color:var(--muted);min-width:170px;text-align:right}.group-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-left:8px}.grade.active{border-color:var(--grade);background:#1a3448;color:#fff}.grade[data-grade=perfect]{--grade:#f5fbff}.grade[data-grade=great]{--grade:#69dbff}.grade[data-grade=good]{--grade:#ffd166}.grade[data-grade=miss]{--grade:#ff5360}.grade:disabled{opacity:.32;cursor:not-allowed}
</style>
</head>
<body>
<main class="shell">
<div class="top"><div><h1>Hit Effect Prototype</h1><div class="hint">Click the stage to trigger. Compare the impact core, broken ring and type-specific shapes.</div></div><div class="hint">runtime preview only</div></div>
<div class="stage-wrap"><canvas id="stage" width="1280" height="720"></canvas></div>
<div class="controls"><button data-kind="tap" class="active">Tap</button><button data-kind="ex">EX-Tap</button><button data-kind="drag">Drag</button><button data-kind="hold">Hold</button><button data-kind="mixer">Mixer</button><button data-kind="mine">Mine</button><span class="group-label">grade</span><button class="grade active" data-grade="perfect">Perfect</button><button class="grade" data-grade="great">Great</button><button class="grade" data-grade="good">Good</button><button class="grade" data-grade="miss">Early Miss</button><label>strength <input id="strength" type="range" min=".55" max="1.45" value="1" step=".05"></label><label><input id="loop" type="checkbox" checked> loop</label><div class="readout" id="readout">Tap / 1.00x</div></div>
</main>
<script>
(() => {
const c=document.getElementById('stage'),x=c.getContext('2d'),bs=[...document.querySelectorAll('[data-kind]')],gs=[...document.querySelectorAll('[data-grade]')],st=document.getElementById('strength'),lp=document.getElementById('loop'),ro=document.getElementById('readout');
const grades={perfect:{label:'Perfect',color:[245,251,255]},great:{label:'Great',color:[105,219,255]},good:{label:'Good',color:[255,209,102]},miss:{label:'Early Miss',color:[255,83,96]}};const allowed={tap:['perfect','great','good','miss'],ex:['perfect','great','good','miss'],drag:['perfect'],hold:['perfect'],mixer:['perfect'],mine:['miss']};let kind='tap',grade='perfect',born=performance.now()-420,pos={x:.5,y:.5};
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),rgba=(q,a)=>'rgba('+q[0]+','+q[1]+','+q[2]+','+clamp(a)+')',pol=(r,a)=>[Math.cos(a)*r,Math.sin(a)*r],lab=v=>v==='ex'?'EX-Tap':v[0].toUpperCase()+v.slice(1);
function fire(px=pos.x,py=pos.y){pos={x:px,y:py};born=performance.now()}
function bg(){x.fillStyle='#080c14';x.fillRect(0,0,c.width,c.height);x.strokeStyle='#162235';x.lineWidth=1;for(let i=80;i<c.width;i+=80){x.beginPath();x.moveTo(i,0);x.lineTo(i,c.height);x.stroke()}for(let i=60;i<c.height;i+=60){x.beginPath();x.moveTo(0,i);x.lineTo(c.width,i);x.stroke()}x.strokeStyle='#34455f';x.lineWidth=2;x.beginPath();x.moveTo(110,c.height/2);x.lineTo(c.width-110,c.height/2);x.moveTo(c.width/2,80);x.lineTo(c.width/2,c.height-80);x.stroke()}
function core(q,p,a,span,vertical){const d=vertical?[0,1]:[1,0],r=20+13*(1-p),g=x.createRadialGradient(0,0,0,0,0,r*3.5);g.addColorStop(0,rgba([255,255,255],a));g.addColorStop(.22,rgba(q,a*.55));g.addColorStop(1,rgba(q,0));x.save();x.globalCompositeOperation='lighter';x.fillStyle=g;x.beginPath();x.arc(0,0,r*3.5,0,Math.PI*2);x.fill();x.lineCap='round';x.strokeStyle=rgba(q,a*.9);x.lineWidth=8*(1-p)+2;let n=span*(.15+p*.48);x.beginPath();x.moveTo(-d[0]*n,-d[1]*n);x.lineTo(d[0]*n,d[1]*n);x.stroke();x.strokeStyle=rgba([255,255,255],a*.8);x.lineWidth=2;n=span*(.1+p*.38);x.beginPath();x.moveTo(-d[0]*n,-d[1]*n);x.lineTo(d[0]*n,d[1]*n);x.stroke();x.fillStyle=rgba([255,255,255],a);x.beginPath();x.arc(0,0,r*.42,0,Math.PI*2);x.fill();x.restore()}
function ring(q,p,a,r,n=12,w=5){x.save();x.globalCompositeOperation='lighter';x.lineCap='round';for(let i=0;i<n;i++){let z=i/n*Math.PI*2+.16,s=.16+.18*((i*7)%3);x.strokeStyle=rgba(q,a*(.55+.25*((i+1)%2)));x.lineWidth=w*(1-p*.55);x.beginPath();x.arc(0,0,r,z,z+s);x.stroke()}x.restore()}
function shards(q,p,a,n=8){x.save();x.globalCompositeOperation='lighter';x.lineCap='round';for(let i=0;i<n;i++){let z=i/n*Math.PI*2+.22,r=24+p*36+(i%2)*8,h=r+16+p*32+(i%3)*7,u=pol(r,z),v=pol(h,z);x.strokeStyle=rgba(q,a*(.62-p*.28));x.lineWidth=i%2?2:3;x.beginPath();x.moveTo(u[0],u[1]);x.lineTo(v[0],v[1]);x.stroke()}x.restore()}
function tap(q,p,a,ex){core(q,p,a,ex?150:122,false);ring(q,p,a,26+(1-Math.pow(1-p,3))*122,ex?16:11,ex?6:5);shards(q,p,a,ex?12:8);if(ex)ring([255,255,255],p*.9,a*.8,52+(1-Math.pow(1-p,3))*100,10,3)}
function drag(q,p,a){core(q,p,a,136,false);x.save();x.globalCompositeOperation='lighter';x.rotate(-.35);for(let i=-1;i<=1;i++){let z=i*28+p*42;x.strokeStyle=rgba(q,a*(.72-p*.32));x.lineWidth=4-p*2;x.beginPath();x.moveTo(z-30,-16);x.lineTo(z+4,0);x.lineTo(z-30,16);x.stroke()}x.restore();shards(q,p,a*.75,6)}
function hold(q,p,a,now){let lead=clamp(p/.18),active=clamp((p-.14)/.12)*clamp((.9-p)/.12),release=clamp((p-.84)/.16),pulse=.78+.22*(.5+.5*Math.sin(now*.014)),flow=(now*.0028)%1,apex=Math.pow(clamp(1-Math.min(flow,1-flow)/.12),2);core(q,lead,a*(p<.28?1:.28),126,false);let g=34+active*18,b=25+active*12;x.save();x.globalCompositeOperation='lighter';x.lineCap='round';x.strokeStyle=rgba(q,a*(.58+.22*pulse));x.lineWidth=7-2*active;for(let s of[-1,1]){x.beginPath();x.moveTo(s*g,-b);x.lineTo(s*(g-12),0);x.lineTo(s*g,b);x.stroke()}if(active>0){x.strokeStyle=rgba(q,a*(.35+.24*pulse));x.lineWidth=3;x.beginPath();x.moveTo(-112,0);x.lineTo(112,0);x.stroke();for(let i=0;i<5;i++){let u=(flow+i*.2)%1,y=-112+u*224,fade=Math.sin(u*Math.PI);x.fillStyle=rgba([255,255,255],a*(.2+.25*fade)*pulse);x.beginPath();x.arc(0,y,3+3*fade,0,Math.PI*2);x.fill();x.strokeStyle=rgba(q,a*(.18+.2*fade));x.lineWidth=2;x.beginPath();x.moveTo(-22,y);x.lineTo(22,y);x.stroke()}x.fillStyle=rgba([255,255,255],a*(.3+.55*apex));x.beginPath();x.arc(0,-112,5+10*apex,0,Math.PI*2);x.fill()}x.restore();ring(q,p,a*(.34+.22*pulse),46+active*24,10,3);if(release>0)shards(q,release,a*release*.72,6)}
function mixer(q,p,a,now){let lead=clamp(p/.18),active=clamp((p-.14)/.12)*clamp((.9-p)/.12),release=clamp((p-.84)/.16),pulse=.78+.22*(.5+.5*Math.sin(now*.014)),flow=(now*.0028)%1,apex=Math.pow(clamp(1-Math.min(flow,1-flow)/.12),2);core(q,lead,a*(p<.28?1:.28),110,true);x.save();x.globalCompositeOperation='lighter';let z=p*Math.PI*2+flow*Math.PI*.65;for(let i=0;i<3;i++){let r=38+i*23+active*24;x.strokeStyle=rgba(q,a*(.72-i*.15+.12*pulse));x.lineWidth=5-i;x.beginPath();x.arc(0,0,r,z+i*1.7,z+i*1.7+3.8-p*.8);x.stroke();let u=pol(r,z+i*1.7),shine=rgba([255,255,255],a*(.35+.3*pulse));x.fillStyle=shine;x.beginPath();x.arc(u[0],u[1],4+2*pulse,0,Math.PI*2);x.fill()}for(let i=0;i<4;i++){let u=pol(66+p*22,z+i*Math.PI/2);x.fillStyle=rgba([255,238,248],a*(.8-p*.3));x.beginPath();x.arc(u[0],u[1],5-p*2,0,Math.PI*2);x.fill()}if(active>0){x.strokeStyle=rgba(q,a*(.26+.2*pulse));x.lineWidth=3;x.beginPath();x.moveTo(0,-112);x.lineTo(0,112);x.stroke();for(let i=0;i<5;i++){let u=(flow+i*.2)%1,y=-112+u*224,fade=Math.sin(u*Math.PI);x.fillStyle=rgba([255,255,255],a*(.2+.25*fade)*pulse);x.beginPath();x.arc(0,y,3+3*fade,0,Math.PI*2);x.fill()}x.fillStyle=rgba([255,255,255],a*(.3+.55*apex));x.beginPath();x.arc(0,-112,5+10*apex,0,Math.PI*2);x.fill()}x.restore();if(release>0)shards(q,release,a*release*.62,6)}
function mine(q,p,a){x.save();x.globalCompositeOperation='lighter';x.lineCap='round';let e=34+p*72;x.strokeStyle=rgba(q,a*.9);x.lineWidth=8-p*3;x.beginPath();x.moveTo(-e,-e*.42);x.lineTo(e,e*.42);x.moveTo(e,-e*.42);x.lineTo(-e,e*.42);x.stroke();ring(q,p,a*.65,28+p*90,10,4);x.fillStyle=rgba([255,232,232],a);x.beginPath();x.arc(0,0,9-p*4,0,Math.PI*2);x.fill();x.restore()}
function loop(now){let e=now-born,duration=(kind==='hold'||kind==='mixer')?1700:360,t=e/duration;if(lp.checked&&e>duration+260){fire()}bg();let p=clamp(t),q=grades[grade].color,strength=Number(st.value),a;if(kind==='hold'||kind==='mixer'){let head=clamp(p/.11),sustain=clamp((p-.12)/.12)*clamp((.91-p)/.11),release=clamp((p-.84)/.16),pulse=.76+.24*(.5+.5*Math.sin(now*.014));a=(head*1.05*clamp((.28-p)/.14)+sustain*.48*pulse+release*.70)*strength}else{a=clamp(Math.min(1,p/.08)*Math.pow(1-p,1.45)*strength*1.55)}x.save();x.translate(pos.x*c.width,pos.y*c.height);if(t<=1){if(kind==='tap')tap(q,p,a,false);else if(kind==='ex')tap(q,p,a,true);else if(kind==='drag')drag(q,p,a);else if(kind==='hold')hold(q,p,a,now);else if(kind==='mixer')mixer(q,p,a,now);else mine(q,p,a)}x.restore();requestAnimationFrame(loop)}
const gradeName=()=>kind==='mine'?'Mine Miss':grades[grade].label;const syncGradeControls=()=>{let ok=allowed[kind];if(!ok.includes(grade))grade=ok[0];gs.forEach(b=>{let enabled=ok.includes(b.dataset.grade);b.disabled=!enabled;b.classList.toggle('active',enabled&&b.dataset.grade===grade);if(b.dataset.grade==='miss')b.textContent=kind==='mine'?'Mine Miss':'Early Miss'})};const setReadout=()=>{syncGradeControls();ro.textContent=lab(kind)+' / '+gradeName()+' / '+Number(st.value).toFixed(2)+'x'};bs.forEach(b=>b.onclick=()=>{kind=b.dataset.kind;bs.forEach(z=>z.classList.toggle('active',z===b));setReadout();fire()});gs.forEach(b=>b.onclick=()=>{if(b.disabled)return;grade=b.dataset.grade;setReadout();fire()});st.oninput=setReadout;c.onpointerdown=e=>{let r=c.getBoundingClientRect();fire((e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height)};setReadout();fire();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
