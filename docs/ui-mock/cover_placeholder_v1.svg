<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Dynamite Universe no-cover placeholder</title>
  <desc id="desc">A dark technical placeholder with a geometric waveform mark and no-cover label.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1d"/>
      <stop offset="0.58" stop-color="#10182e"/>
      <stop offset="1" stop-color="#090d19"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35e0ff"/>
      <stop offset="1" stop-color="#77f0ff"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#8fa8ca" stroke-opacity="0.07" stroke-width="2"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cut-frame">
      <path d="M72 32H920L992 104V920L920 992H104L32 920V104Z"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#base)"/>
  <rect width="1024" height="1024" fill="url(#grid)" clip-path="url(#cut-frame)"/>

  <path d="M32 220V104L104 32H258M766 32H920L992 104V220M992 804V920L920 992H766M258 992H104L32 920V804"
        fill="none" stroke="#35e0ff" stroke-opacity="0.48" stroke-width="8"/>
  <path d="M64 254V132L132 64H286M738 64H892L960 132V254M960 770V892L892 960H738M286 960H132L64 892V770"
        fill="none" stroke="#8393b2" stroke-opacity="0.18" stroke-width="3"/>

  <path d="M0 742L330 412H1024V1024H0Z" fill="#35e0ff" fill-opacity="0.025"/>
  <path d="M1024 286L688 622H1024Z" fill="#ff4d8f" fill-opacity="0.045"/>
  <path d="M32 860H420" stroke="#35e0ff" stroke-opacity="0.22" stroke-width="4"/>
  <path d="M604 164H992" stroke="#ff4d8f" stroke-opacity="0.20" stroke-width="4"/>

  <g transform="translate(512 420)">
    <path d="M-210-154H150L210-94V154H-150L-210 94Z" fill="#0b1226" stroke="#35e0ff" stroke-opacity="0.62" stroke-width="5"/>
    <path d="M-172-112H118L172-58V112H-118L-172 58Z" fill="none" stroke="#7384a5" stroke-opacity="0.22" stroke-width="3"/>

    <g filter="url(#glow)">
      <rect x="-128" y="-30" width="24" height="60" fill="url(#cyan)"/>
      <rect x="-80" y="-70" width="24" height="140" fill="url(#cyan)"/>
      <rect x="-32" y="-112" width="24" height="224" fill="url(#cyan)"/>
      <rect x="16" y="-82" width="24" height="164" fill="#a3e635"/>
      <rect x="64" y="-46" width="24" height="92" fill="#ff4d8f"/>
      <rect x="112" y="-22" width="24" height="44" fill="#ff4d8f"/>
    </g>
    <path d="M-146 0H150" stroke="#e9f3ff" stroke-opacity="0.28" stroke-width="4"/>
  </g>

  <g text-anchor="middle" font-family="Orbitron, Segoe UI, Arial, sans-serif">
    <text x="512" y="675" fill="#e9f3ff" font-size="70" font-weight="700" letter-spacing="10">NO COVER</text>
    <text x="512" y="730" fill="#8290ac" font-size="24" font-weight="600" letter-spacing="8">COMMUNITY CHART</text>
  </g>

  <rect x="92" y="910" width="128" height="8" fill="#35e0ff"/>
  <rect x="228" y="910" width="42" height="8" fill="#ff4d8f"/>
  <rect x="278" y="910" width="24" height="8" fill="#a3e635"/>
  <text x="916" y="924" text-anchor="end" fill="#8290ac" font-family="Segoe UI, Arial, sans-serif" font-size="22" letter-spacing="4">DYNAMITE UNIVERSE</text>
</svg>
